<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser - GitHub Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #app {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            display: flex;
        }

        #app {
            display: flex;
            flex-direction: column;
            background: white;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 12px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #e8e8e8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .address-bar {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .address-bar:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.2);
        }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
            align-items: center;
        }

        .tab {
            padding: 8px 12px;
            background: #ddd;
            border: 1px solid #ccc;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            max-width: 200px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .tab:hover {
            background: #e8e8e8;
        }

        .tab.active {
            background: white;
            border-bottom-color: white;
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-close {
            padding: 0 4px;
            min-width: auto;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .tab-close:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .new-tab-btn {
            padding: 4px 12px;
            margin-left: auto;
        }

        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #fafafa;
            color: #666;
        }

        .empty-state h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #333;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state .hint {
            font-size: 13px;
            color: #999;
            margin-top: 16px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            text-align: center;
        }

        .error-message h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="toolbar">
            <button id="backBtn" title="Back">← Back</button>
            <button id="forwardBtn" title="Forward">Forward →</button>
            <button id="reloadBtn" title="Reload">🔄 Reload</button>
            <input type="text" id="addressBar" class="address-bar" placeholder="Enter URL... (e.g., google.com)">
            <button id="goBtn">Go</button>
        </div>

        <div class="tabs" id="tabs"></div>

        <div class="content" id="content"></div>
    </div>

    <script src="browser.js"></script>
</body>
</html>
